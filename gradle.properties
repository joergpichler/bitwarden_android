android.experimental.enableTestFixturesKotlinSupport=true

kotlin.code.style=official
kotlin.compilerArgs=-Xjspecify-annotations=strict, -Xtype-enhancement-improvements-strict-mode

# --- Memory tuning for a low-spec build host (Intel N150, 12 GB shared, ~6 GB usable) ---
#
# Kotlin compilation, KSP and R8 all run inside the Gradle daemon so memory stays predictable:
#   daemon heap (3 GB) + metaspace (<=1 GB) + JVM overhead ~= 4.5 GB peak RSS,
#   plus the forked javac (capped at 1 GB in the root build.gradle.kts) while it runs.
# If R8 (minifyFdroidReleaseWithR8) still runs out of heap, raise -Xmx to 3584m.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon. A separate
# Kotlin daemon inherits the Gradle -Xmx by default, which can double peak memory use.
kotlin.compiler.execution.strategy=in-process
# The N150 has 4 cores; 2 workers caps how many heavy tasks share the heap at once.
org.gradle.workers.max=2
# Let an idle daemon exit after 10 minutes (default: 3 hours) to return RAM to other services.
org.gradle.daemon.idletimeout=600000

# Local CI only needs the F-Droid APK. Skips library AARs and the AAB when the pipeline runs
# `assembleRelease bundleRelease` (see root build.gradle.kts). Set to false to build them again.
localCi.apkOnly=true

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Disable build features that are enabled by default and we do not need
# developer.android.com/reference/tools/gradle-api/7.4/com/android/build/api/dsl/BuildFeatures
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
